<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intake: final design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Schibsted+Grotesk:wght@700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Intake review 17-10-2026, section 3 (changes A to E). Desktop only, fictional data. Nothing here is built. */
:root{--bg:#F3F6F7;--surface:#fff;--sunk:#F6F9FA;--ink:#14212A;--muted:#4D5C66;--faint:#6F7D86;--line:#D7DFE3;--accent:#0B6E7F;--accent-ink:#fff;--accent-soft:#DCEFF2;--bad:#B3261E;--warn:#8A5A00;--warn-soft:#FBF0D6;--ok:#1E6B3A;--ok-soft:#DDF1E3;
--font:"Source Sans 3","Segoe UI",system-ui,sans-serif;--display:"Schibsted Grotesk",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1518;--surface:#171E22;--sunk:#1B2428;--ink:#E4EAED;--muted:#A2AEB5;--faint:#86939A;--line:#2A343A;--accent:#5FC4D6;--accent-ink:#00323A;--accent-soft:#16363C;--bad:#FF8A80;--warn:#F0C66B;--warn-soft:#3A2F12;--ok:#7FD39A;--ok-soft:#173222}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);padding:14px 16px 60px}
.top,.scr,.note{max-width:1100px;margin:0 auto}h1{font:800 22px var(--display);margin:0 0 4px}.lede{color:var(--muted);max-width:100ch;margin:0 0 8px}
.jr{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;align-items:center}.st{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:28px;padding:0 10px;font:500 12px var(--font);cursor:pointer;color:var(--ink)}.st[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px}.lab{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cap{margin:0 0 10px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--muted);font-size:13px;min-height:40px}.cap b{color:var(--ink)}
.frame{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:18px 24px 24px;min-height:440px}
.frame h2{font:800 22px var(--display);margin:0}.sub{color:var(--muted);margin:2px 0 12px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.btn{height:28px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:600 12.5px var(--font);color:var(--ink);cursor:pointer;white-space:nowrap}.btn:hover{border-color:var(--faint)}.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}.btn:disabled{opacity:.45;cursor:default}
.grp{font:800 15px var(--display);margin:14px 0 6px;display:flex;gap:8px;align-items:baseline}.grp span{font:400 13px var(--font);color:var(--muted)}
.row{border:1px solid var(--line);background:var(--surface);border-radius:10px;margin:0 0 8px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.row.sel{outline:2px solid var(--accent);outline-offset:1px}
.row .t{font-weight:600;font-size:15px}.row .m{font-size:12.5px;color:var(--muted)}.row .act{display:flex;gap:6px;align-items:center}
.age{font-size:12.5px;color:var(--muted);white-space:nowrap}.age.old{color:var(--warn);font-weight:600}
.chip{display:inline-block;font:600 11.5px var(--font);padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);line-height:19px;margin-left:6px;vertical-align:1px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.res{grid-column:1/-1;font-size:13px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}.res b{color:var(--ink)}
.prog{grid-column:1/-1;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}.prog i{display:block;height:100%;width:60%;background:var(--accent)}
.sel2{font:500 12.5px var(--font);border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink);height:24px;padding:0 4px}
.menu{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:6px;z-index:5;min-width:230px}.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px;font:500 13px var(--font);color:var(--ink);cursor:pointer}.menu button:hover{background:var(--sunk)}
.keys{font:500 11.5px var(--mono);color:var(--faint);margin:0 0 8px}.keys kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface);color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;align-items:start}
.pane{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 14px}.pane h3{font:800 15px var(--display);margin:0 0 6px}.pane .tag{font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.nav{display:flex;gap:6px;align-items:center;margin:0 0 10px}.nav .it{padding:4px 10px;border-radius:8px;font-size:13px;color:var(--muted)}.nav .it.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:18px;text-align:center;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 11px var(--font);padding:0 5px;margin-left:4px}
.series{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;margin:10px 0 0;font-size:13px}.series h4{font:800 14px var(--display);margin:0 0 4px}.series .stat{color:var(--muted)}
.gate{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 10px 10px 0;padding:8px 12px;font-size:13px;margin:10px 0 0}
.tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}.tog i{width:34px;height:18px;border-radius:9px;background:var(--line);position:relative;display:inline-block}.tog i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .15s}.tog[aria-checked=true] i{background:var(--accent)}.tog[aria-checked=true] i::after{left:18px}
.cardn{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 16px;font-size:13px;max-width:1100px;margin:16px auto 0}.cardn h3{font:700 14px var(--display);margin:0 0 6px}.cardn ul{margin:0;padding-left:18px;color:var(--muted)}.cardn li{margin:3px 0}
.rec{max-width:1100px;margin:16px auto 0;border:2px solid var(--accent);border-radius:12px;background:var(--accent-soft);padding:12px 16px}.rec b{font-family:var(--display)}

.panel{position:fixed;right:16px;bottom:16px;width:340px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;z-index:9}.panel h4{font:800 14px var(--display);margin:0 0 6px;display:flex;justify-content:space-between}.panel .msg{background:var(--sunk);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:13px}.panel input{width:100%;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface);color:var(--ink)}
.fab{position:fixed;right:16px;bottom:16px;z-index:8}
.det{grid-column:1/-1;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.live{font-size:12.5px;color:var(--faint);margin:0 0 8px}
.sel2{height:24px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.peek{position:sticky;top:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:13px}.peek h3{font:800 16px var(--display);margin:0 0 4px}.peek .q{border-left:3px solid var(--accent);background:var(--sunk);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0;color:var(--ink)}.peek .src{color:var(--muted);font-size:12.5px}.peek .why{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;margin:8px 0;font-size:12.5px}
.row.pick{outline:2px solid var(--accent);outline-offset:1px}.row{cursor:default}.row .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.k{font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:0 6px;line-height:18px;background:var(--sunk);color:var(--muted)}.k.dec{background:var(--accent-soft);color:var(--accent)}.k.risk{background:var(--warn-soft);color:var(--warn)}.k.cf{background:#FBE7E5;color:var(--bad)}
.fold{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:12px}.fold b{font:800 15px var(--display)}
.card1{max-width:640px;margin:10px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:20px 24px}.card1 h3{font:800 20px var(--display);margin:4px 0 6px}.card1 .q{border-left:3px solid var(--accent);background:var(--sunk);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.pg{height:6px;border-radius:3px;background:var(--sunk);margin:0 0 12px;overflow:hidden}.pg i{display:block;height:100%;background:var(--accent)}
.keyrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.keyrow .btn{height:36px;padding:0 16px;font-size:14px}.keyrow kbd{font:600 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;background:var(--sunk);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-size:13px;display:flex;gap:12px;align-items:center;z-index:9}.toast button{background:none;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;font:600 13px var(--font)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}.seg button{border:0;background:none;padding:6px 14px;font:600 13px var(--font);color:var(--muted);cursor:pointer}.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.pipe{display:flex;gap:8px;margin:6px 0 12px;align-items:center}.pipe .st2{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}.pipe .st2[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}.pipe .st2 b{font:800 20px var(--display);display:block}.pipe .ar{color:var(--faint)}
.inl{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}.inl .q{border-left:3px solid var(--accent);background:var(--sunk);padding:6px 10px;border-radius:0 8px 8px 0;margin:6px 0;font-size:13px}
</style></head><body>
<div class="top"><h1>Review: R3 + R2 together, and R1</h1><p class="lede">For looking at, nothing decided. R3 puts what needs you first and folds routine proposals into one group; R2 shows the evidence beside the item; R1 is the one-at-a-time pass. Fictional data, desktop only. Nothing here is built.</p>
<div class="jr"><span class="lab">View</span><button class="st" data-v="list" aria-pressed="true">R3 + R2 · Attention first, evidence beside</button><button class="st" data-v="one" aria-pressed="false">R1 · One at a time</button><span class="sep"></span><span class="lab">Sample</span><button class="st" data-s="mixed" aria-pressed="true">Mixed</button><button class="st" data-s="routine" aria-pressed="false">All routine</button><button class="st" data-s="empty" aria-pressed="false">Empty</button></div>
<div class="cap" id="cap" role="status"></div></div>
<div class="scr"><div class="frame" id="frame"></div></div>
<div class="cardn" id="notes"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const ALL=[
{id:1,k:"Minutes",kc:"",t:"Minutes: Example Programme steering, 15-10",o:"Priya Nair",due:"",p:"Example Programme",need:"Minutes are always checked by you",d:2,q:"Draft minutes of the steering call: 3 decisions, 5 actions, 1 risk.",src:"Teams transcript, steering 15-10, 15:00"},
{id:2,k:"Decision",kc:"dec",t:"Move go-live to 20-11-2026",o:"Priya Nair",due:"",p:"Example Programme",need:"A new decision is never batched",d:2,q:"\"So we agree go-live moves to the twentieth of November, and Priya will tell the client.\"",src:"Steering 15-10, at 41:12"},
{id:3,k:"Risk",kc:"risk",t:"Vendor may exit the market",o:"Sam Okoro",due:"",p:"Example Programme",need:"A new risk is never batched",d:2,q:"\"If they pull out we lose the connector, and we have no second source.\"",src:"Steering 15-10, at 28:40"},
{id:4,k:"Conflict",kc:"cf",t:"Confirm data owner (due 22-10)",o:"Omar Reid",due:"22-10",p:"Example Programme",need:"Looks like ABC-A-004 \"Name the data owner\", due 19-10",d:5,q:"\"Omar, can you confirm who owns the data by next Wednesday?\"",src:"Mail from Lena Park, 12-10"},
{id:5,k:"Needs a project",kc:"cf",t:"Review the supplier contract clause 9",o:"Sara Khan",due:"24-10",p:"",need:"No project matched; choose one to continue",d:1,q:"\"Sara, please look at clause 9 before we sign.\"",src:"Teams chat, 16-10"},
{id:6,k:"Action",kc:"",t:"Send the SOW to legal",o:"Omar Reid",due:"21-10",p:"Example Programme",routine:1,d:2,q:"\"I'll send the SOW to legal on Tuesday.\"",src:"Steering 15-10, at 12:05"},
{id:7,k:"Action",kc:"",t:"Book the vendor demo",o:"Sam Okoro",due:"23-10",p:"Example Programme",routine:1,d:2,q:"\"Sam, can you book the demo for the week after?\"",src:"Steering 15-10, at 33:50"},
{id:8,k:"Update",kc:"",t:"Mark done: Draft the comms plan",o:"Lena Park",due:"",p:"Example Programme",routine:1,d:3,q:"\"The comms plan went out yesterday.\"",src:"Mail from Lena Park, 14-10 (probably done)"},
{id:9,k:"Action",kc:"",t:"Share the test schedule",o:"Priya Nair",due:"28-10",p:"Example Programme",routine:1,d:2,q:"\"I'll share the test schedule by the 28th.\"",src:"Steering 15-10, at 52:10"},
{id:10,k:"Date change",kc:"",t:"Move 'UAT start' to 30-10",o:"Sam Okoro",due:"30-10",p:"Example Programme",routine:1,d:1,q:"\"UAT will start on the thirtieth.\"",src:"Teams chat, 16-10"}];
let view="list",sample="mixed",items,pick=null,openRoutine=false,toast=null,one=0,hist=[];
const agetxt=d=>d===0?"today":d===1?"1 day":d+" days";
function reset(){items=JSON.parse(JSON.stringify(sample==="empty"?[]:sample==="routine"?ALL.filter(x=>x.routine):ALL));items.forEach(x=>x.s="open");pick=null;one=0;hist=[];toast=null;openRoutine=false}
const open=()=>items.filter(x=>x.s==="open"||x.s==="later");
function rowHtml(x){const meta=[x.o,x.due?("due "+x.due):"",x.p||"No project"].filter(Boolean).join(" · ");
 return `<div class="row ${pick===x.id?"pick":""}" data-id="${x.id}" data-a="pick"><div><div class="t"><span class="k ${x.kc}">${x.k}</span>${x.t}</div><div class="m">${meta}</div></div><div class="act"><span class="age">${agetxt(x.d)}</span><button class="btn pri" data-a="ap" data-id="${x.id}">Approve</button><button class="btn" data-a="rj" data-id="${x.id}" aria-label="Reject">✕</button></div></div>`}
function peek(){const x=items.find(i=>i.id===pick);if(!x)return `<div class="peek"><h3>Evidence</h3><div class="src">Pick a row to see where it came from, in the words it was said or written.</div></div>`;
 return `<div class="peek"><h3>${x.t}</h3><div class="src">${x.k} · ${x.o}${x.p?" · "+x.p:""}</div>${x.need?`<div class="why">${x.need}</div>`:""}<div class="q">${x.q}</div><div class="src">${x.src} · <a href="#" onclick="return false">Open the source</a></div><div style="display:flex;gap:6px;margin-top:12px"><button class="btn pri" data-a="ap" data-id="${x.id}">Approve</button><button class="btn" data-a="ed" data-id="${x.id}">Edit</button><button class="btn" data-a="rj" data-id="${x.id}">Reject…</button></div></div>`}
function listView(){const o=open(),need=o.filter(x=>!x.routine),rt=o.filter(x=>x.routine);
 if(!o.length)return `<h2>Review</h2><div class="sub">Claude's proposals.</div><div class="empty">All reviewed. Nothing waiting. <a href="#" onclick="return false">What happens next</a></div>`;
 return `<h2>Review</h2><div class="sub">${o.length} waiting · ${need.length} need you, ${rt.length} routine</div><div class="layout"><div>
 ${need.length?`<div class="grp">Needs you <span>${need.length} · decisions, risks, conflicts, minutes and anything without a project</span></div>${need.map(rowHtml).join("")}`:""}
 ${rt.length?`<div class="grp">Routine <span>${rt.length} · plain actions, date changes and probably-done updates</span></div><div class="fold"><div><b>${rt.length} routine proposals</b><div class="m" style="color:var(--muted);font-size:12.5px">Each has an owner, a project and its source. None is a decision, risk or minutes.</div></div><div class="act" style="display:flex;gap:6px"><button class="btn" data-a="tog">${openRoutine?"Hide":"Look first"}</button><button class="btn pri" data-a="routine">Approve routine (${rt.length})</button></div></div>${openRoutine?rt.map(rowHtml).join(""):""}`:""}
 </div>${peek()}</div>`}
function oneView(){const o=open().filter(x=>x.s==="open");const total=ALL.length;const doneN=items.filter(x=>x.s!=="open").length;
 if(!o.length)return `<h2>Review</h2><div class="card1" style="text-align:center"><h3>That's everything</h3><div class="sub">${items.filter(x=>x.s==="ap").length} approved · ${items.filter(x=>x.s==="rj").length} rejected · ${items.filter(x=>x.s==="later").length} for later</div><div class="keyrow" style="justify-content:center"><button class="btn pri">Apply now</button><button class="btn" data-a="undo">Undo the last one</button></div></div>`;
 const x=o[0];const n=items.length;const i=doneN;
 return `<h2>Review · one at a time</h2><div class="sub">${i+1} of ${n} · needs you first, routine after</div><div class="pg"><i style="width:${Math.round(i/n*100)}%"></i></div>
 <div class="card1"><span class="k ${x.kc}">${x.k}</span> <span style="color:var(--muted);font-size:12.5px"> ${x.p||"No project"} · ${agetxt(x.d)}</span><h3>${x.t}</h3><div style="color:var(--muted)">${x.o}${x.due?" · due "+x.due:""}</div>${x.need?`<div class="why peek" style="border:0;padding:6px 10px;background:var(--warn-soft);color:var(--warn);margin:8px 0;position:static">${x.need}</div>`:""}<div class="q">${x.q}</div><div style="color:var(--muted);font-size:12.5px">${x.src} · <a href="#" onclick="return false">Open the source</a></div>
 <div class="keyrow"><button class="btn pri" data-a="ap" data-id="${x.id}">Approve<kbd>1</kbd></button><button class="btn" data-a="ed" data-id="${x.id}">Edit<kbd>2</kbd></button><button class="btn" data-a="rj" data-id="${x.id}">Reject…<kbd>3</kbd></button><button class="btn" data-a="lt" data-id="${x.id}">Later<kbd>H</kbd></button></div></div>
 <div class="keys" style="text-align:center;margin-top:10px">Same keys every time · the next item opens after each decision · <kbd>Z</kbd> undoes the last one</div>`}
const CAP={list:"<b>R3 + R2.</b> What needs you comes first (decisions, risks, conflicts, minutes, anything without a project); routine proposals are folded into one group you can look at first or approve in one go. Click a row: the side peek shows the sentence it came from and why it needs you. Row meta is one line. Nothing is approved without you, and Approve routine never includes a decision, risk or minutes.",one:"<b>R1.</b> One decision at a time: progress at the top, the evidence on the card, Approve / Edit / Reject / Later on 1, 2, 3 and H, and the next item opens by itself. An Undo toast follows every decision. Needs-you items come first."};
const NOTES={list:["What changes from today",["One line of meta per row, not three; the source moves to the peek.","\"Stale\" goes; age is quiet text (#177).","One bulk button, named for what it covers, only on the routine group.","Reject asks for a reason, as now."]],one:["What changes from today",["Lists stay for browsing; this is the pass you do in a sitting.","Decisions are the same four every time, on the same keys, as Intake's queue will be.","Approving still writes nothing until Apply, as now."]]};
function draw(){document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===view));document.querySelectorAll("[data-s]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===sample));
 $("#frame").innerHTML=view==="list"?listView():oneView();$("#cap").innerHTML=CAP[view];const n=NOTES[view];$("#notes").innerHTML=`<h3>${n[0]}</h3><ul>${n[1].map(t=>`<li>${t}</li>`).join("")}</ul>`;
 $("#toast").innerHTML=toast?`<div class="toast">${toast}<button data-a="undo">Undo</button></div>`:""}
function decide(id,s,msg){const x=items.find(i=>i.id===id);if(!x)return;x.s=s;hist.push(id);if(s==="later"){}toast=msg;draw();clearTimeout(window._t);window._t=setTimeout(()=>{toast=null;draw()},4000)}
document.addEventListener("click",e=>{const v=e.target.closest("[data-v]");if(v){view=v.dataset.v;draw();return}const sm=e.target.closest("[data-s]");if(sm){sample=sm.dataset.s;reset();draw();return}
 const a=e.target.closest("[data-a]");if(!a)return;const id=+a.dataset.id||+(a.closest("[data-id]")||{dataset:{}}).dataset.id,act=a.dataset.a;
 if(act==="pick"){if(e.target.closest("button"))return;pick=id;draw()}
 else if(act==="ap"){decide(id,"ap","Approved. It is written at the next Apply.")}
 else if(act==="rj"){const x=items.find(i=>i.id===id);if(confirmReason())decide(id,"rj","Rejected: reason saved.")}
 else if(act==="lt")decide(id,"later","Kept for later.");
 else if(act==="tog"){openRoutine=!openRoutine;draw()}
 else if(act==="routine"){items.filter(x=>x.routine&&x.s==="open").forEach(x=>{x.s="ap";hist.push(x.id)});toast="Approved routine: "+hist.length+" proposals.";draw()}
 else if(act==="undo"){const l=hist.pop();const x=items.find(i=>i.id===l);if(x)x.s="open";toast=null;draw()}});
function confirmReason(){return true}
document.addEventListener("keydown",e=>{if(view!=="one")return;const o=open().filter(x=>x.s==="open");if(e.key==="z"||e.key==="Z"){const l=hist.pop();const x=items.find(i=>i.id===l);if(x){x.s="open";draw()}return}if(!o.length)return;const x=o[0];
 if(e.key==="1")decide(x.id,"ap","Approved. Press Z to undo.");else if(e.key==="3")decide(x.id,"rj","Rejected. Press Z to undo.");else if(e.key==="h"||e.key==="H")decide(x.id,"later","Kept for later. Press Z to undo.")});
reset();draw();
