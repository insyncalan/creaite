# Run the tests on GitHub's runners without making a release (the release workflow runs them too, before it builds the zip).
# Actions › Tests › Run workflow; "files" names test files (space-separated, e.g. "test_motion.py test_cell_edit.py") or is left
# empty for the whole suite.
#
# ===== BL-242 (sprint-portability): the matrix =====
# Python 3.9 (the floor creaite promises) and 3.14 on Ubuntu, both required; macOS (the primary platform) on 3.14 with
# continue-on-error, so a macOS runner that fails to start, or a flaky Chrome there, never blocks anything. The repository is
# public, so these runners cost nothing; the remaining costs are run time and flaky Chrome starts.
#
# Public-repository safety, in place for when the automatic triggers are switched on: `pull_request`, never
# `pull_request_target` (a fork's code never runs with this repository's token or secrets); read-only permissions; no secrets
# in the job; one run per branch or pull request at a time (a newer run cancels the older); documents-only changes skipped
# (paths-ignore).
#
# BL-234 is parked (Alan): this runs only by hand. To run it on pull requests and pushes to main as well, swap the active
# `on:` line below for the commented one under it. That one line is the whole change.
# on: {workflow_dispatch: {inputs: {files: {description: "Test files to run (empty: all)", required: false, default: ""}}}}
on: {workflow_dispatch: {inputs: {files: {description: "Test files to run (empty: all)", required: false, default: ""}, macos: {description: "Add the macOS job (#83)", type: boolean, required: false, default: false}}}, pull_request: {paths-ignore: ["README.md", "dev/*.md", "dev/release-notes/**", "dev/sprints/**", "dev/mockups/**"]}, push: {branches: [main], paths-ignore: ["README.md", "dev/*.md", "dev/release-notes/**", "dev/sprints/**", "dev/mockups/**"]}}
#
# ===== #89: who runs what =====
# Python 3.14 runs every test file (the browser tests included); Python 3.9, the floor, runs the files that never start Chrome
# (`--quick`: the quick tier, read from the files by dev/tools/run_support.py). Each is split in shards (`--shard I/N`).
# So a browser test runs once per commit, not twice, and the floor is still tested on all the rest. #89 (round 2): 8 shards
# for 3.14 and 2 for 3.9, balanced greedily by the real per-file times in dev/tools/shard_times.txt (refresh it from a recent
# full run's logs: the lines "OK file.py (Ns)"), so the slowest shard is the wall. macOS (3.14, all files, 3
# shards) runs on release branches only. `--max-fail 8` stops a shard that has plainly gone wrong after 8 failed files.
# Files that failed last time start first (dev/tests/.last-failed), which helps a local run; a fresh runner has none.
# ===== end #89 =====

name: Tests
# #89: a hand-started run of named files is named "Tests (files)", so release.yml can tell it from a full run.
run-name: ${{ github.event.inputs.files && format('Tests ({0})', github.event.inputs.files) || 'Tests' }}

permissions:
  contents: read

concurrency:
  # One automatic run per pull request or branch: a newer one cancels the older. Manual runs each get their own group (run_id),
  # so a second hand-started run (say, one test file) never cancels the first.
  group: tests-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }} · shard ${{ matrix.shard }}/${{ matrix.python == '3.9' && 2 || 8 }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # #89: Python 3.14 runs the suite in 8 shards and 3.9 (the quick tier) in 2 (dev/tools/run_tests.py --shard I/N), side
      # by side, so the wait is the slowest shard (the exclude drops 3.9's shards 3 to 8). Every test file is in exactly one shard (dev/tests/test_run_tests_shard.py proves it), and the
      # split is the same on every job because it depends only on the file names and dev/tools/shard_times.txt.
      # The "Tests passed" job below is green only if every shard is.
      matrix:
        os: [ubuntu-24.04]      # not ubuntu-latest: it became 26.04 on 21-10-2026, which has no Python 3.9 (the floor)
        python: ["3.9", "3.14"]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          - {python: "3.9", shard: 3}
          - {python: "3.9", shard: 4}
          - {python: "3.9", shard: 5}
          - {python: "3.9", shard: 6}
          - {python: "3.9", shard: 7}
          - {python: "3.9", shard: 8}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Find Chrome
        # The browser tests find Chrome through dev/tools/cdp.py chrome_path(): CREAITE_CHROME, then the PATH, then macOS.
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          MAC="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ -z "$CHROME" ] && [ -x "$MAC" ]; then CHROME="$MAC"; fi
          test -n "$CHROME" || { echo "No Chrome on this runner"; exit 1; }
          echo "CREAITE_CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          python3 --version

      - name: Tests
        env:
          FILES: ${{ github.event.inputs.files }}
          JOBS: 4
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.python == '3.9' && 2 || 8 }}
          SCOPE: ${{ matrix.python == '3.9' && '--quick' || '' }}
        run: |
          if [ -n "$FILES" ]; then
            # named files: shard 1 runs them, the others have nothing to do
            [ "$SHARD" = "1" ] || { echo "Named files run in shard 1."; exit 0; }
            fail=0
            for f in $FILES; do echo "== $f"; python3 "dev/tests/$f" || fail=1; done
            exit $fail
          else
            python3 dev/tools/run_tests.py -j "$JOBS" $SCOPE --shard "$SHARD/$SHARDS" --max-fail 8
          fi


  macos:
    # macOS (3.14, every file, 3 shards) runs on release branches only (release-*; Alan, 15-10-2026, #89), or when a hand-started run sets macos=true (#83). It needs about 2
    # hours and GitHub runs only five macOS jobs at once, so on a push to main or a pull request it held the run open for
    # nothing; Linux decides those. It is a job of its own, continue-on-error, and "Tests passed" does not wait for it, so
    # a release run is green with Linux while macOS is still running. A macOS runner that fails never blocks a cut.
    # A hand-started run can add it too (#83): gh workflow run Tests --ref <branch> -f macos=true
    if: startsWith(github.head_ref || github.ref_name, 'release-') || (github.event_name == 'workflow_dispatch' && github.event.inputs.macos == 'true')
    name: macos-latest · Python 3.14 · shard ${{ matrix.shard }}/3
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Find Chrome
        # The browser tests find Chrome through dev/tools/cdp.py chrome_path(): CREAITE_CHROME, then the PATH, then macOS.
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          MAC="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ -z "$CHROME" ] && [ -x "$MAC" ]; then CHROME="$MAC"; fi
          test -n "$CHROME" || { echo "No Chrome on this runner"; exit 1; }
          echo "CREAITE_CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          python3 --version

      - name: Tests
        env:
          FILES: ${{ github.event.inputs.files }}
          JOBS: 3
          SHARD: ${{ matrix.shard }}
          SCOPE: ''
        run: |
          if [ -n "$FILES" ]; then
            # named files: shard 1 runs them, the others have nothing to do
            [ "$SHARD" = "1" ] || { echo "Named files run in shard 1."; exit 0; }
            fail=0
            for f in $FILES; do echo "== $f"; python3 "dev/tests/$f" || fail=1; done
            exit $fail
          else
            python3 dev/tools/run_tests.py -j "$JOBS" $SCOPE --shard "$SHARD/3" --max-fail 8
          fi

  passed:
    # The one result to wait for (and to require): green only if every Linux shard passed. A skipped or cancelled
    # shard counts as a failure here. The optional macOS job is not in needs, so this never waits for it.
    name: Tests passed
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = "success"
